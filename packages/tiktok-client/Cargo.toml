[package]
name = "tiktok-client"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async
tokio = { version = "1.53.1", features = ["full"] }

# Logging
tracing = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["cookies", "json"] }

# Other
thiserror = "2"
url = "2.5.8"
scraper = "0.22"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
